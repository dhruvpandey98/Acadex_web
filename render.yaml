services:
  - type: web
    name: acadex
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix server ci --include=dev && npm run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
